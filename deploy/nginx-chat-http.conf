# 首次签发证书用的 HTTP-only 配置（chat.shunkai-dg.cn）
# 签发完成后用 nginx-chat.conf 替换本文件。
server {
    listen 80;
    listen [::]:80;
    server_name chat.shunkai-dg.cn;

    root /srv/chat-demo/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/chat.access.log;
    error_log  /var/log/nginx/chat.error.log warn;
}
