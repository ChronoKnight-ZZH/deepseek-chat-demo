# chat.shunkai-dg.cn —— chat-demo 静态前端
#
# 用法：
#   1) 构建前端：chat-demo 下 npm run build（生产包默认直连 api.shunkai-dg.cn）
#   2) 产物部署到 /srv/chat-demo/dist
#   3) cp nginx-chat.conf /etc/nginx/conf.d/
#   4) certbot --nginx -d chat.shunkai-dg.cn --agree-tos -m ops@example.com --redirect
#
# 如果改用同源反代（chat 域名转发 /auth、/v1），需要把前端改为
# BFF_BASE=/v1、AUTH_BASE=/auth 重新构建，并删除下面 CSP 里的 api 域名。

server {
    listen 80;
    listen [::]:80;
    server_name chat.shunkai-dg.cn;

    # 证书续期/首次签发的 HTTP-01 挑战
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.shunkai-dg.cn;

    # 由 certbot 写入
    # ssl_certificate     /etc/letsencrypt/live/chat.shunkai-dg.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chat.shunkai-dg.cn/privkey.pem;

    root /srv/chat-demo/dist;
    index index.html;

    # CentOS 7 自带 OpenSSL 1.0.2 不支持 TLSv1.3；升级 OpenSSL 后可加回 TLSv1.3
    ssl_protocols TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_CHAT:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 页面有内联脚本（推导 <base>）与内联样式，必须保留 'unsafe-inline'；
    # connect-src 指向生产 API 域名；图片允许 https 以显示 Markdown 外链图。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://api.shunkai-dg.cn; frame-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json text/html image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 指纹资源长缓存
    location /static/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # HTML 不缓存，保证发布后立即拿到新指纹
    location = /index.html {
        expires -1;
    }

    # SPA：/chat/<id> 刷新与直链都回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/chat.access.log;
    error_log  /var/log/nginx/chat.error.log warn;
}
